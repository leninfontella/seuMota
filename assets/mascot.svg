<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mascote seuMota — senhor simpático com óculos e barba branca">
  <!-- Body / shirt -->
  <path d="M48 180 Q30 170 28 200 L172 200 Q170 170 152 180 Q140 188 100 188 Q60 188 48 180Z" fill="#FFFFFF"/>
  <!-- Collar -->
  <path d="M85 182 L100 195 L115 182 Q105 188 100 188 Q95 188 85 182Z" fill="#E0E0E0"/>
  <!-- Neck -->
  <rect x="88" y="162" width="24" height="24" rx="8" fill="#F5C9A0"/>
  <!-- Head -->
  <ellipse cx="100" cy="110" rx="58" ry="65" fill="#F5C9A0"/>
  <!-- Bald shine -->
  <ellipse cx="88" cy="72" rx="18" ry="12" fill="rgba(255,255,255,0.18)" transform="rotate(-15,88,72)"/>
  <!-- Ears -->
  <ellipse cx="42"  cy="110" rx="10" ry="16" fill="#F5C9A0"/>
  <ellipse cx="158" cy="110" rx="10" ry="16" fill="#F5C9A0"/>
  <ellipse cx="42"  cy="110" rx="6"  ry="10" fill="#E8A878"/>
  <ellipse cx="158" cy="110" rx="6"  ry="10" fill="#E8A878"/>
  <!-- Bushy eyebrows -->
  <path d="M60 97 Q73 89 86 95"  stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M114 95 Q127 89 140 97" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Glasses left frame -->
  <rect x="52"  y="100" width="42" height="30" rx="10" fill="rgba(255,255,255,0.15)" stroke="#3A2A1A" stroke-width="4"/>
  <!-- Glasses right frame -->
  <rect x="106" y="100" width="42" height="30" rx="10" fill="rgba(255,255,255,0.15)" stroke="#3A2A1A" stroke-width="4"/>
  <!-- Glasses bridge and arms -->
  <line x1="94"  y1="115" x2="106" y2="115" stroke="#3A2A1A" stroke-width="3.5"/>
  <line x1="52"  y1="115" x2="38"  y2="118" stroke="#3A2A1A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="148" y1="115" x2="162" y2="118" stroke="#3A2A1A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="73"  cy="115" r="10" fill="#4A3728"/>
  <circle cx="127" cy="115" r="10" fill="#4A3728"/>
  <circle cx="77"  cy="111" r="3"  fill="white"/>
  <circle cx="131" cy="111" r="3"  fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="135" rx="9" ry="7" fill="#E8A878"/>
  <!-- Full white beard -->
  <path d="M46 138 Q38 160 48 175 Q64 190 100 192 Q136 190 152 175 Q162 160 154 138 Q144 155 100 158 Q56 155 46 138Z" fill="white"/>
  <!-- Beard texture lines -->
  <path d="M56 148 Q65 158 72 155" stroke="rgba(210,210,210,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 158 L100 185"      stroke="rgba(210,210,210,0.7)" stroke-width="2" fill="none"/>
  <path d="M144 148 Q135 158 128 155" stroke="rgba(210,210,210,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Mustache -->
  <path d="M78 137 Q88 144 100 141 Q112 144 122 137" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="58"  cy="132" rx="12" ry="8" fill="rgba(240,120,100,0.15)"/>
  <ellipse cx="142" cy="132" rx="12" ry="8" fill="rgba(240,120,100,0.15)"/>
</svg>
